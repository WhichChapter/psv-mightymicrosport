name: Build Mighty Micros Vita package

on:
  push:
    branches: [GPT]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GPT branch
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git wget curl unzip python3

      - name: Set up VitaSDK
        shell: bash
        run: |
          SDK_URL="$(wget -qO- https://github.com/vitasdk/vita-headers/raw/master/.travis.d/last_built_toolchain.py | python3 - master linux)"
          test -n "$SDK_URL"
          mkdir -p "$GITHUB_WORKSPACE/vitasdk"
          wget -qO- "$SDK_URL" | tar xj -C "$GITHUB_WORKSPACE/vitasdk" --strip-components=1
          echo "VITASDK=$GITHUB_WORKSPACE/vitasdk" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/vitasdk/bin" >> "$GITHUB_PATH"

      - name: Build and install vitaGL
        run: |
          git clone --depth 1 https://github.com/Rinnegatamante/vitaGL.git
          make -C vitaGL -j2
          make -C vitaGL install

      - name: Download and inspect supplied Android ZIP
        shell: bash
        run: |
          set -euo pipefail
          URL='https://filebin.net/yevzs03g58uchgff/com.lego.superheroes.dccomicsmightymicros_1.7.1418-1418_minAPI16%28armeabi-v7a,x86%29%28nodpi%29_apkmirror.com.zip'
          mkdir -p incoming extracted data/mightymicros
          curl --fail --location --retry 3 --retry-all-errors "$URL" -o incoming/mightymicros.zip
          unzip -q incoming/mightymicros.zip -d extracted
          ROOT="$(find extracted -type f -path '*/lib/armeabi-v7a/libunity.so' -printf '%h/../..\n' | head -n1)"
          if [ -z "$ROOT" ]; then
            echo "Could not find lib/armeabi-v7a/libunity.so in the supplied ZIP."
            echo "Archive listing:"
            unzip -l incoming/mightymicros.zip | head -100
            exit 1
          fi
          ROOT="$(realpath "$ROOT")"
          cp -a "$ROOT"/. data/mightymicros/
          test -s data/mightymicros/lib/armeabi-v7a/libunity.so
          test -s data/mightymicros/lib/armeabi-v7a/libil2cpp.so
          test -s data/mightymicros/lib/armeabi-v7a/libmain.so
          echo "Verified Android ARMv7 Unity/IL2CPP libraries."
          du -sh data/mightymicros

      - name: Configure and compile VPK
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"
          cmake --build build --parallel 2

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: mighty-micros-GPT-vpk
          path: build/*.vpk
          if-no-files-found: error
          retention-days: 1
