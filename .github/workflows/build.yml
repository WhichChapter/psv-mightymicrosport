name: Mighty Micros Android-to-Vita port

on:
  push:
    branches: [GPT]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port project
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl unzip zip python3 binutils file imagemagick

      - name: Install VitaSDK nightly-softfp
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://github.com/vitasdk/vdpm/releases/latest/download/bootstrap-vitasdk.sh -o /tmp/bootstrap-vitasdk.sh
          export VITASDK="$HOME/vitasdk"
          VITASDK_CHANNEL=nightly-softfp bash /tmp/bootstrap-vitasdk.sh
          echo "VITASDK=$VITASDK" >> "$GITHUB_ENV"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
          "$VITASDK/bin/arm-vita-eabi-gcc" --version

      - name: Install softfp VitaSDK libraries
        shell: bash
        run: |
          set -euxo pipefail
          printf 'y\n' | "$VITASDK/bin/vdpm" install opensles zlib kubridge taihen libmathneon SceShaccCgExt vitaShaRK

      - name: Fetch real Android-to-Vita loader framework
        run: |
          git clone --depth 1 https://github.com/v-atamanenko/soloader-boilerplate.git vendor/soloader
          sed -i 's#git@github.com:#https://github.com/#g' vendor/soloader/.gitmodules
          git -C vendor/soloader submodule update --init --recursive --depth 1
          test -f vendor/soloader/source/main.c
          test -f vendor/soloader/lib/so_util/so_util.c
          test -f vendor/soloader/lib/falso_jni/FalsoJNI.c

      - name: Download and unpack Mighty Micros Android package
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://filebin.net/yevzs03g58uchgff/com.lego.superheroes.dccomicsmightymicros_1.7.1418-1418_minAPI16%28armeabi-v7a,x86%29%28nodpi%29_apkmirror.com.zip'
          mkdir -p incoming package/game/assets package/game/lib/armeabi-v7a reports
          curl --fail --location --retry 3 --retry-all-errors "$URL" -o incoming/mightymicros.zip
          python3 scripts/extract_apkmirror_zip.py incoming/mightymicros.zip package/game reports/package.txt
          find package/game -type f -name '*.so' -print
          test -n "$(find package/game -type f -name '*.so' -print -quit)"
          readelf -h package/game/lib/armeabi-v7a/*.so > reports/elf-headers.txt 2>&1 || true
          for so in package/game/lib/armeabi-v7a/*.so; do
            echo "===== $so =====" >> reports/exports.txt
            readelf -d "$so" 2>/dev/null | grep NEEDED >> reports/exports.txt || true
            readelf -Ws "$so" 2>/dev/null | grep -E 'JNI_OnLoad|ANativeActivity_onCreate|Java_' >> reports/exports.txt || true
            readelf -Ws "$so" 2>/dev/null | awk '$7 == "UND" {print $8}' | sort -u >> reports/imports.txt || true
          done
          ENTRY_SO=""
          for so in package/game/lib/armeabi-v7a/*.so; do
            if readelf -Ws "$so" 2>/dev/null | awk '$7 != "UND" && $8 == "JNI_OnLoad" { found=1 } END { exit !found }'; then
              ENTRY_SO="$(basename "$so")"
              break
            fi
          done
          if [ -z "$ENTRY_SO" ]; then
            ENTRY_SO="$(basename "$(find package/game/lib/armeabi-v7a -maxdepth 1 -type f -name '*.so' | sort | head -n1)")"
            echo "WARNING: no defined JNI_OnLoad export found; selecting $ENTRY_SO for loader diagnostics." | tee reports/entrypoint-error.txt
          fi
          test -n "$ENTRY_SO"
          echo "$ENTRY_SO" > reports/entry-so.txt
          if [ -d package/game/apk-metadata ]; then
            find package/game/apk-metadata -name classes.dex -print0 | while IFS= read -r -d '' dex; do
              strings "$dex" | grep -Ei 'UnityPlayer|nativeRender|nativeInit|UnitySendMessage|UnityPlayerActivity|onCreate|onResume|onPause|SurfaceView|GameActivity' >> reports/java-entrypoints.txt || true
            done
          fi
          for so in package/game/lib/armeabi-v7a/*.so; do
            strings "$so" | grep -Ei 'Unity version|UnityPlayer|nativeRender|nativeInit|ANativeActivity|JNI_OnLoad|OpenSLES|eglCreateContext' >> reports/unity-strings.txt || true
          done
          cat reports/package.txt
          cat reports/exports.txt || true
          cat reports/java-entrypoints.txt || true
          cat reports/unity-strings.txt || true

      - name: Configure the upstream so-loader for Mighty Micros
        shell: bash
        run: |
          set -euxo pipefail
          cd vendor/soloader
          ENTRY_SO="$(cat ../../reports/entry-so.txt)"
          test -f lib/vitagl/source/vitaGL.h
          sed -i 's#<vitaGL.h>#\"../../vitaGL.h\"#' lib/vitagl/source/utils/preprocessor/preprocessor.cpp
          python3 ../../scripts/configure_template.py CMakeLists.txt "$ENTRY_SO"
          cp ../../source/main.c source/main.c
          cp ../../source/multiso.h source/multiso.h
          cp ../../source/multiso.c source/multiso.c
          cp ../../source/getentropy.c source/getentropy.c
          cp ../../source/native_registry.c source/native_registry.c
          cp ../../source/native_registry.h source/native_registry.h
          cp ../../source/native_window.c source/native_window.c
          cp ../../source/native_window.h source/native_window.h
          python3 ../../scripts/patch_loader.py
          if [ -f ../../package/game/res/drawable-xxxhdpi-v4/app_icon.png ]; then
            convert ../../package/game/res/drawable-xxxhdpi-v4/app_icon.png -resize 128x128! extras/livearea/icon0.png
          fi
          if [ -f ../../package/game/res/drawable-xhdpi-v4/app_banner.png ]; then
            convert ../../package/game/res/drawable-xhdpi-v4/app_banner.png -resize 960x540! -gravity center -background black -extent 960x544 extras/livearea/pic0.png
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNDK_PORT=ON -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"
          cmake --build build --parallel 2
          mkdir -p ../../out
          cp build/mighty_micros.vpk ../../out/

      - name: Package user-supplied Android game data
        run: |
          cd package/game
          zip -qr ../../out/mighty-micros-data.zip .
          cd ../..
          cp reports/package.txt out/
          cp reports/exports.txt out/ || true
          cp reports/imports.txt out/ || true
          cp reports/java-entrypoints.txt out/ || true
          cp reports/unity-strings.txt out/ || true
          cp reports/entry-so.txt out/ || true

      - name: Upload VPK, game data and analysis
        uses: actions/upload-artifact@v4
        with:
          name: mighty-micros-port-build
          path: out/*
          if-no-files-found: error
          retention-days: 7
