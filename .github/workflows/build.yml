name: Build Vita VPK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up VitaSDK (softfp)
        run: |
          git clone https://github.com/vitasdk/vdpm.git
          cd vdpm
          VITASDK="$GITHUB_WORKSPACE/vitasdk" VITASDK_CHANNEL=nightly-softfp ./bootstrap-vitasdk.sh
          echo "VITASDK=$GITHUB_WORKSPACE/vitasdk" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/vitasdk/bin" >> $GITHUB_PATH
          "$GITHUB_WORKSPACE/vitasdk/bin/vdpm" install taihen

      - name: Install kubridge stubs
        run: |
          git clone https://github.com/TheOfficialFloW/kubridge.git
          cd kubridge
          mkdir build && cd build
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake ..
          make install

      - name: Install vitaGL
        run: |
          git clone https://github.com/Rinnegatamante/vitaGL.git
          make -C vitaGL install

      - name: Compile Project
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake ..
          make

      - name: Upload VPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vita-port-vpk
          path: build/*.vpk
