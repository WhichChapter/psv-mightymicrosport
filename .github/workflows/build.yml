name: Build Vita VPK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up VitaSDK
        run: |
          SDK_URL=$(wget -qO- https://github.com/vitasdk/vita-headers/raw/master/.travis.d/last_built_toolchain.py | python3 - master linux)
          echo "Downloading VitaSDK: $SDK_URL"
          mkdir -p $GITHUB_WORKSPACE/vitasdk
          wget -O- "$SDK_URL" | tar xj -C $GITHUB_WORKSPACE/vitasdk --strip-components=1
          echo "VITASDK=$GITHUB_WORKSPACE/vitasdk" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/vitasdk/bin" >> $GITHUB_PATH

      - name: Install kubridge stubs
        run: |
          git clone https://github.com/TheOfficialFloW/kubridge.git
          cd kubridge
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake ..
          make install

      - name: Install vitaGL
        run: |
          git clone https://github.com/Rinnegatamante/vitaGL.git
          make -C vitaGL install

      - name: Compile Project
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake ..
          make

      - name: Upload VPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vita-port-vpk
          path: build/*.vpk
