name: Build Vita VPK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up VitaSDK (softfp)
        run: |
          git clone https://github.com/vitasdk/vdpm.git
          export VITASDK="$GITHUB_WORKSPACE/vitasdk"
          export VITASDK_CHANNEL=nightly-softfp
          export VDPM_NONINTERACTIVE=1
          cd vdpm
          ./bootstrap-vitasdk.sh
          echo "VITASDK=$VITASDK" >> $GITHUB_ENV
          echo "$VITASDK/bin" >> $GITHUB_PATH
          "$VITASDK/bin/vdpm" install taihen

      - name: Install kubridge stubs
        run: |
          git clone https://github.com/TheOfficialFloW/kubridge.git
          cd kubridge
          # Current VitaSDK headers take user pointers directly; kubridge upstream still casts them to integers.
          sed -i 's/(uintptr_t)name/name/; s/(uintptr_t)opt/opt/' main.c
          mkdir build && cd build
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake ..
          make install

      - name: Install SceShaccCgExt
        run: |
          git clone https://github.com/bythos14/SceShaccCgExt.git
          cmake -S SceShaccCgExt -B SceShaccCgExt/build \\
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \\
            -DCMAKE_INSTALL_PREFIX="$VITASDK/arm-vita-eabi"
          cmake --build SceShaccCgExt/build --parallel
          cmake --install SceShaccCgExt/build

      - name: Install vitaShaRK
        run: |
          git clone https://github.com/Rinnegatamante/vitaShaRK.git
          make -C vitaShaRK install

      - name: Install vitaGL
        run: |
          git clone https://github.com/Rinnegatamante/vitaGL.git
          make -C vitaGL install SOFTFP_ABI=1

      - name: Compile Project
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake ..
          make

      - name: Upload VPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vita-port-vpk
          path: build/*.vpk
